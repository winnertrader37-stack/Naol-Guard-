name: Build Naol Private APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find sdkmanager
        run: |
          set -eu
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "Found: $SDKM"
          test -n "$SDKM"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project files
        run: |
          echo "=== Repo files ==="
          find . -type f -not -path "./.git/*" | sort
          echo "=== Checking required files ==="
          for f in \
            settings.gradle.kts \
            build.gradle.kts \
            gradle.properties \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/naol/privateapp/MainActivity.kt \
            app/src/main/java/com/naol/privateapp/AlarmService.kt
          do
            if [ -f "$f" ]; then
              echo "OK       $f"
            else
              echo "MISSING  $f"
            fi
          done

      - name: Make sure app module is included
        run: |
          echo "=== settings.gradle.kts (before) ==="
          cat settings.gradle.kts
          if ! grep -q ':app' settings.gradle.kts; then
            echo "" >> settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
            echo "Added include(\":app\")"
          fi
          echo "=== settings.gradle.kts (after) ==="
          cat settings.gradle.kts

      - name: Build APK
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            grep -E "^e: |What went wrong|Execution failed|^> |error:|Could not|not found|Unresolved" build.log \
              | head -n 12 \
              | while IFS= read -r line; do echo "::error title=Gradle error::$line"; done
          fi
          exit "$STATUS"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Check APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Naol-Private-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
